name: wirdi
description: Wirdi - Quran, Azkar, Tasbeeh and Prayer Times
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  geolocator: ^14.0.2
  adhan: ^2.0.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.15
  audio_service: ^0.18.15
  share_plus: ^10.1.4
  http: ^1.2.2
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/quran_index.json
    - assets/quran_search_index.json
    - assets/quran/
    - assets/images/
    - assets/icons/
    - assets/NOTICE.md

flutter_native_splash:
  color: "#0F766E"
  color_dark: "#071A17"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0F766E"
    color_dark: "#071A17"
    image: assets/images/splash_logo.png
    icon_background_color: "#0F766E"
    icon_background_color_dark: "#071A17"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png
